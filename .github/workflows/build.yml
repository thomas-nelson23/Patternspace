name: Build

on:
  push:
    branches: [main]
    # Pushing a tag like v0.2.0 also publishes a GitHub release with a zip per platform, which is
    # what the standalone app's update check looks for.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            configure: -G Ninja
            formats: VST3 LV2 CLAP Standalone
          - name: macOS
            os: macos-14
            configure: -G Ninja -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            formats: VST3 AU CLAP Standalone
          - name: Windows
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
            formats: VST3 CLAP Standalone

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev libcurl4-openssl-dev xvfb

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Test the patch engine
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate the VST3 with pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
              unzip -q pluginval.zip
              PLUGINVAL="xvfb-run -a ./pluginval" ;;
            macOS)
              curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
              unzip -q pluginval.zip
              PLUGINVAL="./pluginval.app/Contents/MacOS/pluginval" ;;
            Windows)
              curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
              unzip -q pluginval.zip
              PLUGINVAL="./pluginval.exe" ;;
          esac
          $PLUGINVAL --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            --validate "build/Patternspace_artefacts/Release/VST3/Patternspace.vst3"

      - name: Collect the plug-ins
        shell: bash
        run: |
          mkdir -p dist
          for format in ${{ matrix.formats }}; do
            cp -R "build/Patternspace_artefacts/Release/$format" "dist/$format"
          done
          find dist -name "*.a" -o -name "*.lib" -o -name "*.exp" | xargs rm -f

      - uses: actions/upload-artifact@v4
        with:
          name: Patternspace-${{ matrix.name }}
          path: dist
          if-no-files-found: error

      # Zipped on each runner so the app bundles keep their permissions and symlinks.
      - name: Zip for the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="Patternspace-$version-${{ matrix.name }}.zip"
          case "$RUNNER_OS" in
            macOS) (cd dist && ditto -c -k . "../$zip") ;;
            Windows) (cd dist && 7z a -tzip "../$zip" . > /dev/null) ;;
            *) (cd dist && zip -qry "../$zip" .) ;;
          esac
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-${{ matrix.name }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The app compares its own version with the tag, so they have to agree.
      - name: Check the tag matches the project version
        run: |
          version=$(sed -nE 's/^project\(Patternspace VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in CMakeLists.txt ($version). Bump project(... VERSION) first."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --title "Patternspace ${GITHUB_REF_NAME#v}" --generate-notes
